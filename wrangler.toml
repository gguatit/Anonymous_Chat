name = "anonymous-chat"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# 관리자 인증 시크릿 (필수 설정!)
# npx wrangler secret put ADMIN_ID
# npx wrangler secret put ADMIN_PASSWORD
# npx wrangler secret put HMAC_SECRET

# 토큰 블랙리스트용 KV (세션 무효화)
[[kv_namespaces]]
binding = "ADMIN_TOKENS"
id = "31c6551451f6466bb1ad33fbe10bf966"

# 감사 로그용 KV (관리자 활동 기록)
[[kv_namespaces]]
binding = "ADMIN_LOGS"
id = "5eba46ff86454bf0a6dfb6791789e4f2"

# Durable Objects for WebSocket state management
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]

# Pages integration (for hybrid deployment)
[assets]
directory = "public"
binding = "ASSETS"

# Environment variables
[vars]
ENVIRONMENT = "production"
# HMAC_SECRET should be set in production via: wrangler secret put HMAC_SECRET
# ADMIN_ID should be set in production via: wrangler secret put ADMIN_ID
# ADMIN_PASSWORD should be set in production via: wrangler secret put ADMIN_PASSWORD
# For development: ID=kalpha, Password=kalpha#admin!!

# Observability configuration
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

# Development environment
[env.development]
[env.development.vars]
ENVIRONMENT = "development"
