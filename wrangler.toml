name = "anonymous-chat"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# 관리자 인증 시크릿 (필수 설정!)
# npx wrangler secret put ADMIN_ID
# npx wrangler secret put ADMIN_PASSWORD
# npx wrangler secret put HMAC_SECRET

# 토큰 블랙리스트용 KV (세션 무효화)
[[kv_namespaces]]
binding = "ADMIN_TOKENS"
id = "31c6551451f6466bb1ad33fbe10bf966"

# 푸시 알림 구독 정보 KV
# wrangler kv:namespace create PUSH_SUBSCRIPTIONS 후 id 업데이트 필요
[[kv_namespaces]]
binding = "PUSH_SUBSCRIPTIONS"
id = "52dc3235581a4b2789625b4b0a837fda"

# Durable Objects for WebSocket state management
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "CHANNEL_REGISTRY"
class_name = "ChannelRegistry"

[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChannelRegistry"]

# D1 Database for admin logs (replaces KV.list())
[[d1_databases]]
binding = "DB_ADMIN"
database_name = "anonymous-chat-db"
database_id = "e01628fd-3e3b-4dde-8d57-38779feb1d92"

# Pages integration (for hybrid deployment)
[assets]
directory = "public"
binding = "ASSETS"

# Environment variables
[vars]
ENVIRONMENT = "production"
TURNSTILE_SITE_KEY = "0x4AAAAAADAY6kk52-ZxU23s"
# HMAC_SECRET should be set in production via: wrangler secret put HMAC_SECRET
# ADMIN_ID should be set in production via: wrangler secret put ADMIN_ID
# ADMIN_PASSWORD should be set in production via: wrangler secret put ADMIN_PASSWORD
# VAPID_PUBLIC_KEY should be set via: wrangler secret put VAPID_PUBLIC_KEY
# VAPID_PRIVATE_KEY should be set via: wrangler secret put VAPID_PRIVATE_KEY
# TURNSTILE_SECRET_KEY should be set via: wrangler secret put TURNSTILE_SECRET_KEY

# Observability configuration
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

# Development environment
[env.development]
[env.development.vars]
ENVIRONMENT = "development"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
