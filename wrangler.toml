name = "anonymous-chat"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Durable Objects for WebSocket state management
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]

# Pages integration (for hybrid deployment)
[assets]
directory = "public"
binding = "ASSETS"

# R2 Storage for file sharing (무료 10GB)
[[r2_buckets]]
binding = "FILE_BUCKET"
bucket_name = "chat-file"

# Environment variables
[vars]
ENVIRONMENT = "production"
# HMAC_SECRET should be set in production via: wrangler secret put HMAC_SECRET
# For development, a random secret is auto-generated

# File upload limits (무료 범위 최적화)
MAX_FILE_SIZE_MB = 20
FILE_RETENTION_HOURS = 12
MAX_FILES_PER_IP_PER_DAY = 50

# Observability configuration
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

# Development environment
[env.development]
[env.development.vars]
ENVIRONMENT = "development"

# Cron Triggers (무료: 하루 3번 실행 가능)
[triggers]
crons = ["0 */12 * * *"]  # 12시간마다 실행 (만료 파일 삭제)
